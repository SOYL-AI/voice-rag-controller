# config.yaml — all settings as files, never hardcoded.
#
# Rule (configs/README.md): if you find yourself typing a model name, a
# threshold, or a path directly into code, stop and put it here instead.
#
# Each component owns its own top-level section. Add yours below; don't edit
# someone else's without telling them.

# ---------------------------------------------------------------------------
# llm/ — owner: Ryan
# ---------------------------------------------------------------------------
llm:
  # Which client the code talks to.
  #   mock  — no GPU, no network. Canned answer with synthetic logprobs in the
  #           exact shape the real server returns. Use this for all development.
  #   vllm  — a real vLLM OpenAI-compatible server. Costs money. Real runs only.
  # Override without editing this file: VOICE_RAG_LLM_BACKEND=vllm
  backend: mock

  # Which of the models below is live. Everything else about the system stays
  # the same when this changes — that's the point of keeping it here.
  # Override with: VOICE_RAG_MODEL=qwen3_8b
  #
  # NOTE FOR THE PAPER: Experiment 1 must be reported on ONE model, or the
  # model becomes a confound. The other two entries are fallbacks for when a
  # gated download is still pending — not a comparison set. Whichever is
  # active when real data collection starts must be named in the
  # pre-registration doc.
  active_model: llama31_8b

  models:
    llama31_8b:
      hf_id: meta-llama/Llama-3.1-8B-Instruct
      # Gated on Hugging Face: accept the license on the model page, then set
      # HF_TOKEN. Approval is not always instant — request it early.
      gated: true

    qwen3_8b:
      hf_id: Qwen/Qwen3-8B
      gated: false
      # Qwen3 emits a <think> block by default. That wrecks strict-JSON
      # tracker output and pollutes the logprob sequence with reasoning
      # tokens that aren't part of the answer, so we turn it off at the
      # chat-template level.
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

    mistral7b_v03:
      hf_id: mistralai/Mistral-7B-Instruct-v0.3
      # Requires accepting the terms on the model page; approval is usually
      # immediate. 7B not 8B — close enough to stand in if both others stall.
      gated: true

  # Where the client sends requests. Override with VOICE_RAG_LLM_BASE_URL,
  # which you will need on RunPod (the proxy hostname is generated per pod).
  server:
    base_url: http://localhost:8000/v1
    # vLLM accepts any key unless the server was started with --api-key.
    # If you do set one, put it in this env var — never in this file.
    api_key_env: VLLM_API_KEY
    request_timeout_s: 120

  # Answer generation.
  generation:
    max_tokens: 256
    temperature: 0.2
    top_p: 0.9

  # THE POINT OF THIS ROLE. Experiment 1 is impossible if these are off.
  logprobs:
    enabled: true
    # How many alternatives to return per position. 1 = just the chosen
    # token's confidence. Raise it in Week 2 if the belief vector needs the
    # runner-up distribution (entropy, margin). Must be <= serve.max_logprobs.
    top_k: 5
    # Write the full per-token list into the llm_final payload. Verbose, and
    # that is deliberate: the logs are the paper's raw data.
    log_full: true

  # Flags passed to `vllm serve` by llm/serve.py. Provider-agnostic — these
  # are the same on RunPod, Azure, or any box with a big enough card.
  serve:
    host: 0.0.0.0
    port: 8000
    # bfloat16, NOT a quantized dtype. The logprobs are the measurement
    # instrument for Experiment 1; quantization shifts the output
    # distribution and therefore distorts what we are trying to measure.
    # This is why the card needs >= 24 GB for an 8B model.
    dtype: bfloat16
    max_model_len: 8192
    gpu_memory_utilization: 0.90
    # Ceiling on top_logprobs the server will honour. Must be >= logprobs.top_k.
    max_logprobs: 20
    # Where weights get cached. On RunPod, point this at a network volume so
    # a destroyed pod doesn't mean re-downloading 16 GB.
    download_dir: null

  # State tracker — the JSON form describing what the user wants this turn.
  tracker:
    # Deterministic: this is structured extraction, not writing.
    temperature: 0.0
    max_tokens: 200
    # The fixed schema. Every tracker output has exactly these keys, always.
    # A slot we don't know is "unknown" — that is a correct answer, not an error.
    slots:
      intent: unknown
      room: unknown
      time: unknown
      people: unknown
      confirmed: false
    # Slots whose value is a count and should end up as a JSON number when
    # stated. Everything else stays a string: a room is "412" or "412A", and
    # silently turning it into 412 would lose the second case.
    numeric_slots:
      - people

  # Where conversation logs are written (eventlog/log_writer.py default).
  log_dir: logs

# ---------------------------------------------------------------------------
# audio/ — owner: Adithi
# ---------------------------------------------------------------------------
audio:
  stt:
    # faster-whisper model size. "small" for dev (CPU-friendly), bump to
    # "medium" once this is confirmed working end-to-end.
    model_size: small
    device: cpu
    compute_type: int8
    # How often to re-run transcription on the growing buffer while the
    # user is still speaking. Task spec: 300-500ms.
    partial_interval_ms: 400
    # Trailing silence (ms) after which VAD judges the user has stopped
    # speaking and user_end fires. Temporarily 3000ms for diagnostic experiment.
    silence_hang_ms: 800
    # Microphone gain multiplier applied before VAD. 1.0 = raw mic signal.
    # 2.0 is safe for MacBook Air built-in mic. Raise only if VAD never
    # triggers; lowering it reduces hallucination risk.
    mic_gain: 2.0
    # Force Whisper to transcribe in this language. Prevents it from switching
    # to Vietnamese / Japanese on unclear short utterances.
    language: en
    # Minimum RMS energy gate before VAD evaluation (0.003 for Phase 1A).
    rms_gate: 0.003
  tts:
    engine: piper
    voice_model_path: ./audio/models/en_US-lessac-medium.onnx
    # Playback block size for stop()-ability during barge-in.
    playback_block_ms: 20
    # TTS audio sample rate (Hz). Auto-detected from model .onnx.json if present.
    sample_rate: 22050
    # Barge-in VAD configuration
    barge_in:
      consecutive_frames: 2
      vad_threshold: 0.5
  vad:
    frame_ms: 32

# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# controller/ — owner: Renya
# ---------------------------------------------------------------------------
controller:
  # Phase 2's first real rule: retrieve-or-not, based on the state tracker's
  # uncertainty. See controller/decide.py and controller/README.md.
  decision:
    # Slots the rule inspects. "confirmed" is excluded — its default
    # (false) doesn't indicate the tracker is uncertain about what the user
    # wants; it just means nothing has been confirmed yet.
    key_slots: [intent, room, time, people]
    # If at least this fraction of key_slots is still "unknown", the
    # tracker is too uncertain to trust and the rule retrieves. Separately,
    # "intent" unknown always forces a retrieve — see decide.py.
    unknown_fraction_threshold: 0.5

  # Experiment 2 (timing value): WHEN retrieval launches relative to the
  # user's speech. See controller/timing.py. The retrieve-or-not rule above
  # never changes with this — only the trigger moment does.
  #   sentence_end      — retrieve only after user_end (baseline; unchanged
  #                        pipeline behavior).
  #   immediate         — retrieve as soon as a partial transcript exists,
  #                        overlapping retrieval with the tail of speech.
  #   fixed_early_proxy — retrieve at a fixed point in the modeled speech
  #                        timeline, earlier than `immediate`. NOT a
  #                        forecast of a real pause — there's no
  #                        pause-prediction signal wired in; real pause
  #                        detection needs a signal audio/stt.py doesn't
  #                        expose yet (see controller/timing.py's
  #                        docstring). This policy runs on a
  #                        clearly-labeled fixed proxy until that lands.
  # Override without editing this file: VOICE_RAG_TIMING_POLICY=immediate
  timing:
    policy: sentence_end
    # There's no real audio in the text-input batch/experiment path
    # (simulator scenarios run through pipeline/spine.py's `question=`
    # argument), so `immediate`/`fixed_early_proxy` have nothing real to
    # trigger on there unless we model how long saying the transcript
    # would actually take and sleep through it for real. See
    # controller/timing.py's plan_simulated_speech().
    simulated_speech:
      # Ballpark conversational speaking rate. Speech duration for a given
      # transcript = word_count / words_per_minute * 60s, actually slept
      # through (asyncio.sleep), not just subtracted from a metric.
      words_per_minute: 150
      # fixed_early_proxy's fixed proxy trigger point, as a fraction of the
      # (modeled) speech duration — not a forecast, just a fixed point.
      # Clearly a stub for the text path — see controller/timing.py.
      pause_at_fraction: 0.35

    # Experiment 2 fix: query_ready gate. immediate/fixed_early_proxy must
    # not dispatch retrieval on a (partial) query this short/empty of
    # content — e.g. a single word ("What"/"Tell"/"Can") tanks hit@3 even
    # though it looks fast. Retrieval instead fires at the earliest
    # partial (real, or simulated on the text path — see
    # controller/timing.py) that satisfies BOTH conditions below, never
    # later than sentence_end's own trigger. See
    # controller/timing.py's is_query_ready().
    query_ready:
      # Minimum word count before a (partial) query counts as retrievable.
      min_words: 4
      # Require at least one word outside the small stopword set in
      # controller/timing.py's _QUERY_READY_STOPWORDS (what, is, the, a,
      # can, tell, ...) — guards against e.g. "What is the" (3+ words, all
      # function words) passing on word count alone.
      require_content_word: true

  # Experiment 3 (the coupling hypothesis): the scalarized objective and
  # cost model the price-aware baselines optimize against. Read by
  # controller/baselines/_objective.py, which mirrors every value below as
  # its _DEFAULT_E3_CFG so the baselines stay runnable without this file.
  #
  # Used by: "ours" (joint), "b9" (decomposed-with-prices), and — for the
  # b8 block ONLY — "b8" (independent-best, which never reads prices).
  #
  # FAIRNESS RULE (E3_BASELINE_INTERFACE.md, handbook 29.3): every
  # threshold here must be SWEPT on the dev split under an equal tuning
  # budget before any headline number is reported. These are the starting
  # point of that sweep, not its result.
  e3:
    # Price point used only when the caller passes no prices (Ctx.prices
    # empty). The real sweep always supplies both — see simulator/
    # e3_sweep.py's --lambda-l/--lambda-c. lambda_l is quality lost per
    # SECOND of latency (not per ms — see _objective.py on units);
    # lambda_c is quality per retrieval of compute.
    default_prices:
      lambda_l: 1.0
      lambda_c: 0.05

    # MEASURED from logs/: median duration of a completed retrieval over
    # 751 retrieval_launched -> retrieval_result pairs (p90 was 3187).
    retrieval_latency_ms: 672

    # MEASURED from logs/: mean overlap_with_speech_ms per E2 timing
    # policy — how much of a retrieval landed inside the user's speech and
    # so was never experienced as latency. This is coupling channel 1, and
    # the difference between fixed_early_proxy and sentence_end (188 ms) is
    # exactly the width of the predicted Ours-vs-B9 divergence band per
    # unit lambda_l. See controller/baselines/ours.py's docstring.
    overlap_ms:
      sentence_end: 0        # 0 by construction: launches after user_end
      immediate: 50          # median 0, mean 50, max 1091
      fixed_early_proxy: 188 # median 156, mean 188, max 1428

    # PLACEHOLDER — NOT MEASURED. Fraction of retrieval's quality gain lost
    # by launching early on a partial transcript (coupling channel 2).
    # Small because controller/timing.py's query_ready gate already removed
    # the large version of this effect. To ground it: fit from per-policy
    # hit@3 over simulator/e2_results/ as 1 - hit@3(t)/hit@3(sentence_end).
    # This is the number Ours's TIMING choice is most sensitive to.
    partial_query_risk:
      sentence_end: 0.0
      immediate: 0.02
      fixed_early_proxy: 0.04

    # PLACEHOLDER — NOT MEASURED. Expected extra compute per retrieval from
    # an early launch being invalidated and relaunched. All 751 retrievals
    # in logs/ show forecast_invalidated=false, but that's a property of
    # the text path (which has no continued-speech signal to invalidate
    # against), so 0 would encode more than the data supports. Replace with
    # a real invalidation rate from a live-audio run.
    waste_rate:
      sentence_end: 0.0
      immediate: 0.02
      fixed_early_proxy: 0.08

    # The value-of-information estimate — expected quality gain from
    # retrieving, on [0, 1]. Shared UNCHANGED by ours and b9 so that any
    # measured gap between them comes from joint-vs-decomposed reasoning
    # and not from one side having a better belief estimate.
    voi:
      # max_entropy_nats has no natural ceiling, so it's divided by this to
      # land on [0, 1]. Sweep it.
      max_entropy_nats_scale: 2.5
      # Blend weights when both the entropy and tracker signals are
      # present. Entropy carries more because E1 was designed to validate
      # that family.
      entropy_weight: 0.65
      tracker_weight: 0.35
      # Never estimate a retrieval as worth exactly nothing — a hard zero
      # would make the retrieve branch unreachable at any nonzero price,
      # which would be an artifact of the estimator, not a decision.
      floor: 0.05

    # B8 (independent-best) only. B8 never reads any of the pricing values
    # above — it's the no-price-coupling rival by definition.
    b8:
      # PLACEHOLDER trigger threshold. The only E1 artifact in the repo is
      # a mock smoke run that explicitly must not be cited, so this is not
      # backed by a real AUC yet — and the trigger is meant to be replaced
      # wholesale by the best of B4-B6 once those land. See
      # controller/baselines/b8_independent.py's plug point.
      max_entropy_nats_threshold: 1.2
      # Fallback threshold when no entropy signal is present.
      unknown_fraction_threshold: 0.5
      # Separately tuned in isolation: the policy that hides the most
      # retrieval latency inside speech (see overlap_ms above).
      timing: fixed_early_proxy

